---
- name: Install Sway as tiling manager
  ansible.builtin.pacman:
    name:
      - "sway"
      - "swayidle"
      - "swaylock"
      - "swaybg"
      - "sway-contrib"
    state: "present"
  become: true

- name: Install xdg portals
  ansible.builtin.pacman:
    name:
      - "xdg-desktop-portal"
      - "xdg-desktop-portal-wlr"
    state: "present"
  become: true

- name: Install command line utilities
  ansible.builtin.pacman:
    name:
      - "wl-clipboard"
    state: "present"
  register: clipboard_install
  become: true

- name: Install waybar for customizable title bar
  ansible.builtin.pacman:
    name:
      - "waybar"
    state: "present"
  become: true

- name: Install XWayland compatibility layer
  ansible.builtin.pacman:
    name:
      - "xorg-xwayland"
    state: "present"
  register: xwayland_install
  become: true

- name: Require rebooting sway when xwayland is installed
  ansible.builtin.set_fact:
    restart_sway_tasks: "{{ restart_sway_tasks + ['Configure XWayland'] }}"
  when: xwayland_install.changed

- name: Require rebooting sway when wl-clipboard is installed
  ansible.builtin.set_fact:
    restart_sway_tasks: "{{ restart_sway_tasks + ['Add clipboard utility'] }}"
  when: clipboard_install.changed
